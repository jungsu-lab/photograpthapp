name: Flutter quality gate

on:
  pull_request:
  push:
    branches: [main, feat/real-photo-presets]

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true
          pub-cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --exclude-tags golden

      - name: Build debug Android APK
        run: flutter build apk --debug

  verify-goldens:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true
          pub-cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Verify Windows visual baselines
        run: flutter test --tags golden
